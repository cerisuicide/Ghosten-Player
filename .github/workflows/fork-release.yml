name: Fork Release

on:
  push:
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.4.7-fork.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          cache: true
      - name: Resolve version
        shell: bash
        run: |
          RAW_VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_VERSION="${{ inputs.version }}"
          fi
          VERSION="${RAW_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-fork\.([0-9]+)$ ]]; then
            echo "Expected <major>.<minor>.<patch>-fork.<revision>, got ${VERSION}" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          FORK_REVISION="${BASH_REMATCH[4]}"
          BUILD_NUMBER=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + FORK_REVISION))
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "${GITHUB_ENV}"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Configure signing
        shell: bash
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=keystore.jks"
          } > android/key.properties
      - name: Build signed TV APKs
        run: >-
          flutter build apk
          --release
          --target=lib/main_tv.dart
          --split-per-abi
          --obfuscate
          --split-debug-info=build/symbols
          --target-platform=android-arm,android-arm64
          --build-name=${{ env.VERSION }}
          --build-number=${{ env.BUILD_NUMBER }}
          --dart-define=BUILD_DATE=$(date +%F)
          --dart-define=BUILD_VERSION=${{ env.VERSION }}
          --flavor=tv
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-tv-release.apk "dist/Ghosten-Player-Fork-TV-${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-tv-release.apk "dist/Ghosten-Player-Fork-TV-${VERSION}-arm64-v8a.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ghosten-Player-Fork-TV-${{ env.VERSION }}
          path: dist/*
      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Ghosten Player ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
